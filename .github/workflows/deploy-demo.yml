name: Deploy Web Demo

on:
  push:
    branches:
      - deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Prepare demo files
        run: |
          mkdir -p _site
          cp -r demos/web/* _site/
          mkdir -p _site/fonts
          cp -r assets/fonts/* _site/fonts/
          # Fix font paths
          sed -i 's|../../assets/fonts/|./fonts/|g' _site/main.js
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
