name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Need Skia headers
      
      - name: Get Emscripten version from Skia
        id: emsdk-version
        run: |
          VERSION=$(grep "EMSDK_VERSION = " third_party/skia/bin/activate-emsdk | sed "s/.*'\(.*\)'/\1/")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using Emscripten version: $VERSION"
      
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.emsdk-version.outputs.version }}
      
      - name: Build WASM module
        run: ./scripts/build_wasm.sh
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json
      
      - name: Install dependencies
        working-directory: tests
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install chromium
      
      - name: Setup test assets
        working-directory: tests
        run: ./scripts/setup-test-assets.sh
      
      - name: Run tests
        working-directory: tests
        run: npm test
