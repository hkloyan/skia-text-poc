<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skia Text PoC - Web</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 24px;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e8e8e8;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 600;
            margin: 0 0 8px 0;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 14px;
            color: #7a8ba3;
            margin-bottom: 24px;
        }
        
        .container {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        
        .canvas-wrapper {
            background: #ffffff;
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        canvas {
            display: block;
            border-radius: 8px;
            /* Size set by JavaScript based on devicePixelRatio */
        }
        
        .panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            min-width: 280px;
        }
        
        .panel h2 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00d9ff;
            margin: 0 0 16px 0;
        }
        
        .metrics {
            display: grid;
            gap: 12px;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        
        .metric-label {
            font-size: 13px;
            color: #7a8ba3;
        }
        
        .metric-value {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 14px;
            font-weight: 600;
            color: #00ff88;
        }
        
        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
        }
        
        .status.loading {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.3);
            color: #ffc107;
        }
        
        .status.ready {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }
        
        .status.error {
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid rgba(255, 82, 82, 0.3);
            color: #ff5252;
        }
        
        .control-group {
            margin-bottom: 16px;
        }
        
        .control-label {
            display: block;
            font-size: 13px;
            color: #7a8ba3;
            margin-bottom: 8px;
        }
        
        .control-label span {
            color: #00ff88;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-weight: 600;
        }
        
        .slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.3);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 217, 255, 0.4);
            transition: transform 0.15s ease;
        }
        
        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }
        
        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            cursor: pointer;
            border: none;
        }
        
        .save-btn {
            width: 100%;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .save-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 217, 255, 0.4);
        }
        
        .save-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .format-toolbar {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: #f5f5f5;
            border-radius: 8px 8px 0 0;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
            align-items: center;
        }

        .format-toolbar .toolbar-field {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #333;
        }

        .format-toolbar .toolbar-field input[type="number"] {
            width: 56px;
        }

        .format-toolbar .toolbar-field input[type="checkbox"] {
            accent-color: #00d9ff;
        }
        
        .format-toolbar select,
        .format-toolbar input[type="number"] {
            padding: 6px 10px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            color: #333;
        }
        
        .format-toolbar select:focus,
        .format-toolbar input:focus {
            outline: none;
            border-color: #00d9ff;
        }
        
        .format-toolbar input[type="number"] {
            width: 60px;
        }
        
        .format-toolbar input[type="color"] {
            width: 32px;
            height: 32px;
            padding: 2px;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }

        .control-input,
        .control-group select {
            width: 100%;
            padding: 8px 10px;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.25);
            color: #e8e8e8;
        }

        .control-input:focus,
        .control-group select:focus {
            outline: none;
            border-color: #00d9ff;
        }

        .control-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .control-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #e8e8e8;
        }

        .control-row input[type="color"] {
            width: 32px;
            height: 32px;
            padding: 2px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
        }
        
        .format-btn {
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            color: #333;
            cursor: pointer;
            min-width: 36px;
            transition: all 0.15s ease;
        }
        
        .format-btn:hover {
            background: #e8e8e8;
        }
        
        .format-btn.active {
            background: #333;
            color: white;
            border-color: #333;
        }
        
        .format-btn.italic {
            font-style: italic;
        }
        
        .format-btn.underline {
            text-decoration: underline;
        }
        
        .format-separator {
            width: 1px;
            height: 24px;
            background: #ccc;
            margin: 0 4px;
        }
    </style>
</head>
<body>
    <h1>Skia Text Rendering PoC</h1>
    <p class="subtitle">Cross-platform text rendering using SkParagraph (WASM)</p>
    
    <div class="container">
        <div class="canvas-wrapper">
            <div class="format-toolbar" id="formatToolbar">
                <select id="fontFamily">
                    <option value="Roboto">Roboto</option>
                    <option value="Playfair">Playfair</option>
                    <option value="Playfair-Italic">Playfair Italic</option>
                </select>
                <select id="fontSize" title="Font Size">
                    <option value="8">8</option>
                    <option value="10">10</option>
                    <option value="12">12</option>
                    <option value="14">14</option>
                    <option value="16">16</option>
                    <option value="18">18</option>
                    <option value="20">20</option>
                    <option value="22">22</option>
                    <option value="24" selected>24</option>
                    <option value="28">28</option>
                    <option value="32">32</option>
                    <option value="36">36</option>
                    <option value="48">48</option>
                    <option value="72">72</option>
                </select>
                <input type="color" id="textColor" value="#000000" title="Text Color">
                <div class="format-separator"></div>
                <button class="format-btn" id="boldBtn" title="Bold"><b>B</b></button>
                <button class="format-btn italic" id="italicBtn" title="Italic">I</button>
                <button class="format-btn underline" id="underlineBtn" title="Underline">U</button>
                <div class="format-separator"></div>
                <label class="toolbar-field" title="Letter Spacing">LS
                    <input type="number" id="letterSpacingInput" step="0.1" value="0">
                </label>
                <label class="toolbar-field" title="Word Spacing">WS
                    <input type="number" id="wordSpacingInput" step="0.1" value="0">
                </label>
                <div class="format-separator"></div>
                <label class="toolbar-field" title="Highlight">
                    <input type="checkbox" id="highlightToggle"> HL
                </label>
                <input type="color" id="highlightColor" value="#ffff00" title="Highlight Color">
                <label class="toolbar-field" title="Shadow">
                    <input type="checkbox" id="shadowToggle"> Shadow
                </label>
            </div>
            <canvas id="canvas" width="800" height="400"></canvas>
        </div>
        
        <div class="panel">
            <h2>Controls</h2>
            <div class="control-group">
                <label class="control-label" for="maxWidthSlider">Max Width: <span id="maxWidthValue">700</span> px</label>
                <input type="range" id="maxWidthSlider" min="100" max="780" value="700" class="slider">
            </div>
            <div class="control-group">
                <label class="control-label" for="textAlign">Alignment</label>
                <select id="textAlign">
                    <option value="0" selected>Left</option>
                    <option value="2">Center</option>
                    <option value="1">Right</option>
                    <option value="3">Justify</option>
                    <option value="4">Start</option>
                    <option value="5">End</option>
                </select>
            </div>
            <div class="control-group">
                <label class="control-label" for="maxLinesInput">Max Lines (0 = unlimited)</label>
                <input type="number" id="maxLinesInput" class="control-input" min="0" step="1" value="0">
            </div>
            <div class="control-group">
                <label class="control-label" for="ellipsisInput">Ellipsis</label>
                <input type="text" id="ellipsisInput" class="control-input" value="...">
            </div>
            <div class="control-group">
                <label class="control-label" for="lineHeightInput">Line Height (0 = auto)</label>
                <input type="number" id="lineHeightInput" class="control-input" min="0" step="0.1" value="0">
            </div>
            <button id="saveBtn" class="save-btn" disabled>Save as PNG</button>
            <button id="loadEmojiFontBtn" class="save-btn" style="margin-top: 8px; background: linear-gradient(135deg, #ff6b6b, #feca57);">Load System Emoji Font</button>
            
            <h2 style="margin-top: 24px;">Layout Metrics</h2>
            <div class="metrics">
                <div class="metric">
                    <span class="metric-label">Height</span>
                    <span class="metric-value" id="height">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Width</span>
                    <span class="metric-value" id="width">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Line Count</span>
                    <span class="metric-value" id="lineCount">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Max Intrinsic Width</span>
                    <span class="metric-value" id="maxIntrinsicWidth">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Min Intrinsic Width</span>
                    <span class="metric-value" id="minIntrinsicWidth">-</span>
                </div>
            </div>
            
            <div class="status loading" id="status">Loading WASM module...</div>
        </div>
    </div>
    
    <script src="dist/skia_text.js"></script>
    <script src="main.js"></script>
</body>
</html>
