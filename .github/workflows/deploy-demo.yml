name: Deploy Web Demo

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Need Skia headers

      - name: Get Emscripten version from Skia
        id: emsdk-version
        run: |
          VERSION=$(grep "EMSDK_VERSION = " third_party/skia/bin/activate-emsdk | sed "s/.*'\(.*\)'/\1/")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using Emscripten version: $VERSION"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.emsdk-version.outputs.version }}

      - name: Build WASM
        run: ./scripts/build_wasm.sh

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare demo files
        run: |
          mkdir -p _site
          cp -r demos/web/* _site/
          mkdir -p _site/fonts
          cp -r assets/fonts/* _site/fonts/
          # Fix font paths
          sed -i 's|../../assets/fonts/|./fonts/|g' _site/main.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
